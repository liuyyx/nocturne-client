# Canonical (Mojmap) -> MCP 1.8.9 alias table for DarkClient's 1.8.9 mappings.
#
# The Rust code always spells the *latest* Mojmap name (a `MinecraftClassType`
# for classes, a string literal for members). This table translates those names
# to the **MCP 1.8.9** names, which `gen_legacy_mappings.py` then joins through
# `joined.srg` + `methods.csv`/`fields.csv` to the obfuscated 1.8.9 name (and
# the obfuscated JNI descriptor).
#
# Chain (all four steps are done by the generator):
#   canonical (Mojmap)  --this table-->  MCP 1.8.9
#     --forge189 methods.csv/fields.csv (human name -> SRG)-->  func_/field_
#     --vanilla189 joined.srg (SRG + owner -> obf)-->  obf name + obf descriptor
#
# Resolution rules used by the generator for one (class, kind, member):
#   1. `[overrides."<canonical class>"]` wins (per-class exception), then
#   2. `[methods.<member>]` / `[fields.<member>]` (same resolution for every class).
#   A resolution is either the MCP human name (optionally with a `scope` = the
#   MCP class whose SRG entry to read, for members inherited from a
#   1.8.9-declared superclass) or an explicit `srg` name (when one human name
#   has several SRGs in the same class), or `skip`/`unsupported`.
#
#   `unsupported`  = 1.8.9 has no equivalent API; the member is left out of the
#                    generated JSON on purpose (the Rust call site needs a
#                    per-version branch).
#   `skip`         = resolution happens elsewhere (java.* classes live in
#                    java_mappings.json, trait-internal helpers, ...).
#
# Every `note` is copied into the generator's coverage report.

version = "1.8.9"

# --------------------------------------------------------------------------
# Classes: canonical (as spelled in client/src/mapping/class_type.rs) -> MCP
# --------------------------------------------------------------------------
[classes]
"net/minecraft/client/Minecraft" = "net/minecraft/client/Minecraft"
"net/minecraft/client/player/LocalPlayer" = "net/minecraft/client/entity/EntityPlayerSP"
"net/minecraft/client/multiplayer/ClientLevel" = "net/minecraft/client/multiplayer/WorldClient"
"net/minecraft/world/entity/player/Player" = "net/minecraft/entity/player/EntityPlayer"
"net/minecraft/world/entity/player/Abilities" = "net/minecraft/entity/player/PlayerCapabilities"
"net/minecraft/world/entity/Entity" = "net/minecraft/entity/Entity"
"net/minecraft/world/phys/Vec3" = "net/minecraft/util/Vec3"
"net/minecraft/client/multiplayer/MultiPlayerGameMode" = "net/minecraft/client/multiplayer/PlayerControllerMP"
"net/minecraft/world/entity/Mob" = "net/minecraft/entity/monster/EntityMob"
"net/minecraft/client/gui/screens/Screen" = "net/minecraft/client/gui/GuiScreen"
"net/minecraft/client/renderer/GameRenderer" = "net/minecraft/client/renderer/EntityRenderer"
"net/minecraft/client/gui/Gui" = "net/minecraft/client/gui/GuiIngame"
"net/minecraft/world/entity/LivingEntity" = "net/minecraft/entity/EntityLivingBase"
"net/minecraft/world/effect/MobEffect" = "net/minecraft/potion/Potion"
