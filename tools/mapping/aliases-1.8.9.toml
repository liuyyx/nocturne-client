srg = "func_70092_e"
scope = "net/minecraft/entity/Entity"
note = "Entity.getDistanceSq 在 1.8.9 有两个重载（DDD / BlockPos），此处按 (DDD)D 固定到 func_70092_e"

[methods.isSprinting]
