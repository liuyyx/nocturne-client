# ==========================================================================
# nocturne-client additions
# --------------------------------------------------------------------------
# The surface below comes from the shipped mappings-1.8.9.json (the client's
# curated runtime surface).  DarkClient's table already resolves almost all of
# it; these entries fill the remaining gaps (its generator saw a different set
# of call sites).
# ==========================================================================

[class-aliases]
# Canonical name as the client spells it -> the MCP 1.8.9 class it lives in.
# (Separate from [classes] so this file can be extended without reopening a
#  table header, which TOML forbids.)
"net/minecraft/client/player/RemotePlayer" = "net/minecraft/client/entity/EntityOtherPlayerMP"
"net/minecraft/client/gui/FontRenderer" = "net/minecraft/client/gui/FontRenderer"

[methods.runGameLoop]
mcp = "runGameLoop"
scope = "net/minecraft/client/Minecraft"

[methods.runTick]
mcp = "runTick"
scope = "net/minecraft/client/Minecraft"

[methods.displayGuiScreen]
mcp = "displayGuiScreen"
srg = "func_147108_a"
scope = "net/minecraft/client/Minecraft"

[methods.respawnPlayer]
mcp = "respawnPlayer"
scope = "net/minecraft/client/entity/EntityPlayerSP"

# FontRenderer: MCP 1.8.9 collapses all three to obf "a"; drawString is
# overloaded, so pin the (String,int,int,int) variant the table records.
[methods.drawString]
mcp = "drawString"
srg = "func_78276_b"
scope = "net/minecraft/client/gui/FontRenderer"

[methods.drawStringWithShadow]
mcp = "drawStringWithShadow"
scope = "net/minecraft/client/gui/FontRenderer"

[methods.getStringWidth]
mcp = "getStringWidth"
scope = "net/minecraft/client/gui/FontRenderer"

[fields.fontRenderer]
mcp = "fontRendererObj"
scope = "net/minecraft/client/Minecraft"

[fields.currentScreen]
mcp = "currentScreen"
scope = "net/minecraft/client/Minecraft"

[fields.displayWidth]
mcp = "displayWidth"
scope = "net/minecraft/client/Minecraft"

[fields.displayHeight]
mcp = "displayHeight"
scope = "net/minecraft/client/Minecraft"

[fields.isDead]
mcp = "isDead"
scope = "net/minecraft/entity/Entity"
