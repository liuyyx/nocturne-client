"net/minecraft/world/level/LevelReader" = "net/minecraft/world/IBlockAccess"
"net/minecraft/world/level/chunk/LevelChunk" = "net/minecraft/world/chunk/Chunk"
"net/minecraft/world/level/block/entity/BlockEntity" = "net/minecraft/tileentity/TileEntity"
"net/minecraft/world/level/block/entity/ChestBlockEntity" = "net/minecraft/tileentity/TileEntityChest"
"net/minecraft/world/level/block/entity/EnderChestBlockEntity" = "net/minecraft/tileentity/TileEntityEnderChest"
"net/minecraft/core/BlockPos" = "net/minecraft/util/BlockPos"
"net/minecraft/core/Vec3i" = "net/minecraft/util/Vec3i"
"net/minecraft/client/multiplayer/PlayerInfo" = "net/minecraft/client/network/NetworkPlayerInfo"
"net/minecraft/world/level/GameType" = "net/minecraft/world/WorldSettings$GameType"
"net/minecraft/client/Options" = "net/minecraft/client/settings/GameSettings"
