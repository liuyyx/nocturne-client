"net/minecraft/client/gui/screens/PauseScreen" = "net/minecraft/client/gui/GuiIngameMenu"
"net/minecraft/client/gui/screens/inventory/AbstractContainerScreen" = "net/minecraft/client/gui/inventory/GuiContainer"
"net/minecraft/client/gui/screens/inventory/InventoryScreen" = "net/minecraft/client/gui/inventory/GuiInventory"
"net/minecraft/client/gui/screens/inventory/CraftingScreen" = "net/minecraft/client/gui/inventory/GuiCrafting"
"net/minecraft/client/gui/screens/inventory/CreativeModeInventoryScreen" = "net/minecraft/client/gui/inventory/GuiContainerCreative"
# Network packets: the 1.8.9 protocol classes are shaped differently
# (C03PacketPlayer has no accessors; S12 exposes int motion, not a Vec3), so the
# class names are usable for `resolve_class`/`is_instance_of` but the packet
# snapshot members are not mapped (see the raw-JNI section of the report).
"net/minecraft/network/protocol/game/ServerboundMovePlayerPacket" = "net/minecraft/network/play/client/C03PacketPlayer"
"net/minecraft/network/protocol/game/ServerboundMovePlayerPacket$Pos" = "net/minecraft/network/play/client/C03PacketPlayer$C04PacketPlayerPosition"
"net/minecraft/network/protocol/game/ServerboundMovePlayerPacket$PosRot" = "net/minecraft/network/play/client/C03PacketPlayer$C06PacketPlayerPosLook"
"net/minecraft/network/protocol/game/ServerboundMovePlayerPacket$Rot" = "net/minecraft/network/play/client/C03PacketPlayer$C05PacketPlayerLook"
# 1.8.9 has no separate "status only" class: the abstract C03PacketPlayer itself
# carries only the on-ground flag, which is what StatusOnly adds in 1.21.
"net/minecraft/network/protocol/game/ServerboundMovePlayerPacket$StatusOnly" = "net/minecraft/network/play/client/C03PacketPlayer"
"net/minecraft/network/protocol/game/ClientboundSetEntityMotionPacket" = "net/minecraft/network/play/server/S12PacketEntityVelocity"
"net/minecraft/network/protocol/game/ClientboundPlayerInfoUpdatePacket" = "net/minecraft/network/play/server/S38PacketPlayerListItem"

# java.* is never obfuscated; those classes are carried by the hand-written
# java_mappings.json that the loader merges next to the version mapping.
"java/lang/Iterable" = { skip = "java.* 不混淆 —— 由 java_mappings.json 提供（1.8.9 同名同签名）" }
"java/util/Iterator" = { skip = "java.* 不混淆 —— 由 java_mappings.json 提供（1.8.9 同名同签名）" }
"java/util/Map" = { skip = "java.* 不混淆 —— 由 java_mappings.json 提供（1.8.9 同名同签名）" }
"java/lang/Object" = { skip = "java.* 不混淆 —— 由 java_mappings.json 提供（1.8.9 同名同签名）" }
"java/lang/Integer" = { skip = "java.* 不混淆 —— 由 java_mappings.json 提供（1.8.9 同名同签名）" }
"java/lang/Double" = { skip = "java.* 不混淆 —— 由 java_mappings.json 提供（1.8.9 同名同签名）" }

# Classes with no 1.8.9 counterpart at all.
"com/mojang/blaze3d/platform/Window" = { unsupported = "1.8.9 没有 Window 类：窗口是 LWJGL org.lwjgl.opengl.Display（无句柄对象）" }
"net/minecraft/client/Camera" = { unsupported = "1.8.9 没有独立的 Camera 对象；相机状态是 EntityRenderer 的 cameraZoom/cameraPitch/cameraYaw 字段，视角由 renderViewEntity 推导" }
"net/minecraft/client/OptionInstance" = { unsupported = "1.8.9 没有 OptionInstance；GameSettings 直接存放原始字段（GameSettings 项见 [overrides]）" }
"net/minecraft/world/level/block/entity/BarrelBlockEntity" = { unsupported = "木桶是 1.14 加入的" }
"net/minecraft/world/level/block/entity/ShulkerBoxBlockEntity" = { unsupported = "潜影盒是 1.9 加入的" }
"net/minecraft/world/InteractionHand" = { unsupported = "EnumHand 是 1.9 加入的；1.8.9 交互方法不带手参数（PlayerControllerMP.onPlayerRightClick 无 EnumHand）" }
"net/minecraft/world/item/component/SwingAnimation" = { unsupported = "SwingAnimation 是 26.3 加入的；1.8.9 是 EntityLivingBase.swingItem()" }
"net/minecraft/world/inventory/ContainerInput" = { unsupported = "ClickType 是 1.19 加入的；1.8.9 用 Container.windowClick 的 int mode/button（0=PICKUP 1=QUICK_MOVE 2=SWAP）" }
"net/minecraft/world/entity/EquipmentSlot" = { unsupported = "EntityEquipmentSlot 是 1.9 加入的；1.8.9 用 int 槽位（EntityLivingBase.getEquipmentInSlot(int)）" }

# --------------------------------------------------------------------------
# Members shared by every class that references them.
#   mcp   = MCP 1.8.9 human name (methods.csv / fields.csv `name` column)
#   scope = MCP class whose SRG entry is read (default: the class itself)
#   srg   = pin an exact SRG name when one human name is overloaded
# --------------------------------------------------------------------------

[methods.getInstance]
mcp = "getMinecraft"
scope = "net/minecraft/client/Minecraft"

[methods.getBlockPos]
mcp = "getPos"
scope = "net/minecraft/tileentity/TileEntity"

[methods.getString]
mcp = "getFormattedText"
scope = "net/minecraft/util/IChatComponent"
note = "1.8.9 无 getString()；getFormattedText() 同样返回带样式码的整串文本"

[methods.getItems]
mcp = "getInventory"
scope = "net/minecraft/inventory/Container"
note = "返回 java.util.List（1.21 是 NonNullList）"

[methods.attack]
mcp = "attackEntity"
scope = "net/minecraft/client/multiplayer/PlayerControllerMP"

[methods.stopDestroyBlock]
